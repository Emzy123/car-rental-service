# Render Blueprint for DriveRent Backend API & Database
# Note: Frontend is deployed separately on Vercel.

databases:
  - name: rental-service-db
    databaseName: rental_service
    user: postgres
    plan: free

services:
  # Backend API Service
  - type: web
    name: rental-service-api
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: rental-service-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false  # Set manually to your Vercel URL (e.g. https://your-app.vercel.app)
      - key: BACKEND_URL
        sync: false  # Set manually to your Render URL (e.g. https://rental-service-api.onrender.com)
      - key: PAYSTACK_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: PAYSTACK_PUBLIC_KEY
        sync: false  # Set manually in Render dashboard
      - key: PAYSTACK_DEV_MODE
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@driverent.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: System Admin
      - key: UPLOAD_DIR
        value: /tmp/uploads
    disk:
      name: uploads
      mountPath: /tmp/uploads
      sizeGB: 1
    autoDeploy: true
    healthCheckPath: /api/health
